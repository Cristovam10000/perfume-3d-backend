services:
  # Banco de dados PostgreSQL do backend FastAPI.
  postgres:
    image: postgres:16
    container_name: tcc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      # Banco acessível somente na máquina local.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Serviço de inferência Hunyuan3D-2mv.
  # Requer GPU NVIDIA com pelo menos 6 GB de VRAM.
  hunyuan:
    build: ./docker/hunyuan
    environment:
      HUNYUAN_ENABLE_TEXTURE: ${HUNYUAN_ENABLE_TEXTURE:-1}
      HUNYUAN_TEXTURE_MULTI_VIEW: ${HUNYUAN_TEXTURE_MULTI_VIEW:-1}
      HUNYUAN_TEXTURE_REPO: ${HUNYUAN_TEXTURE_REPO:-tencent/Hunyuan3D-2}
      HUNYUAN_SHAPE_POSTPROCESS: ${HUNYUAN_SHAPE_POSTPROCESS:-1}
      HUNYUAN_SHAPE_REPO: ${HUNYUAN_SHAPE_REPO:-tencent/Hunyuan3D-2mv}
      HUNYUAN_SHAPE_SUBFOLDER: ${HUNYUAN_SHAPE_SUBFOLDER:-hunyuan3d-dit-v2-mv}
      HUNYUAN_SHAPE_VARIANT: ${HUNYUAN_SHAPE_VARIANT:-fp16}
      HUNYUAN_ALLOW_SINGLE_VIEW_FALLBACK: ${HUNYUAN_ALLOW_SINGLE_VIEW_FALLBACK:-1}
      HUNYUAN_FALLBACK_SHAPE_REPO: ${HUNYUAN_FALLBACK_SHAPE_REPO:-tencent/Hunyuan3D-2}
      HUNYUAN_FALLBACK_SHAPE_SUBFOLDER: ${HUNYUAN_FALLBACK_SHAPE_SUBFOLDER:-hunyuan3d-dit-v2-0}
      HUNYUAN_FALLBACK_SHAPE_VARIANT: ${HUNYUAN_FALLBACK_SHAPE_VARIANT:-fp16}
      HUNYUAN_VRAM_BUDGET_MB: ${HUNYUAN_VRAM_BUDGET_MB:-2200}
      MMGP_PROFILE: ${MMGP_PROFILE:-4}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    ports:
      # API interna usada pelo backend executado na mesma máquina.
      - "127.0.0.1:${HUNYUAN_HOST_PORT:-7860}:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hunyuan_cache:/app/hf_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/health | grep -q '\"status\":\"ready\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Primeiro download do checkpoint multi-view pode ultrapassar 10 minutos.
      start_period: 15m
    restart: unless-stopped

volumes:
  # Nomes explícitos preservam os dados mesmo após mover o Compose para o backend.
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-tcc_postgres_data}
  hunyuan_cache:
    name: ${HUNYUAN_CACHE_VOLUME_NAME:-tcc_hunyuan_cache}
